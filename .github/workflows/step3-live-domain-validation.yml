name: Step 3 Live Domain Validation

on:
  workflow_dispatch:
  schedule:
    # Run at 2 AM UTC daily for continuous validation
    - cron: '0 2 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Step 3 against live iGaming domains

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Step 3 Live Domain Validation
        run: npm test -- tests/step3-live-domain-validation.test.ts
        timeout-minutes: 10

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-live-domain-validation-report
          path: /tmp/step3-live-domain-validation-report.md
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/step3-live-domain-validation-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Step 3 Live Domain Validation\n\n' + report
            });
